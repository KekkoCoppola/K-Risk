seed: 42

data:
  raw: data/raw/Dataset for diabetes research.xlsx
  processed: data/processed
  augmented: data/augmented

columns:
  id: "NO"
  diabetes: DM
  age: Age
  gender: Gender
  creatinine: SCRE   # µmol/l
  acr: UMAUCR        # mg/g

# marcatori di malattia renale cronica secondo KDIGO:
# eGFR (CKD-EPI 2021) < 60 ml/min/1.73 m2 oppure ACR >= 30 mg/g
target:
  egfr_threshold: 60
  acr_threshold: 30
  gender_female_code: 2

split:
  test_size: 0.25
  # kdigo_level e target sono calcolati, le altre voci sono colonne del dataset
  stratify: [kdigo_level, DM]

analytics:
  output: analytics
  dpi: 300
  # variabili cliniche usate per il controllo di bilanciamento train/test
  balance_columns:
    - Age
    - Gender
    - BMI
    - waist1
    - Bpsys
    - Bpdia
    - FPG
    - HbA1c
    - CHOL
    - TG
    - HDL
    - LDL
    - SUA
    - ALT
    - HGB
  simulation_runs: 1000
