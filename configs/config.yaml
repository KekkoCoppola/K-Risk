seed: 42

data:
  raw: data/raw/Dataset for diabetes research.xlsx
  processed: data/processed
  augmented: data/augmented

columns:
  id: "NO"
  diabetes: DM
  age: Age
  gender: Gender
  creatinine: SCRE   # µmol/l
  acr: UMAUCR        # mg/g

# marcatori di malattia renale cronica secondo KDIGO:
# eGFR (CKD-EPI 2021) < 60 ml/min/1.73 m2 oppure ACR >= 30 mg/g
target:
  egfr_threshold: 60
  acr_threshold: 30
  gender_female_code: 2

split:
  test_size: 0.25
  # kdigo_level e target sono calcolati, le altre voci sono colonne del dataset
  stratify: [kdigo_level, DM]

analytics:
  output: analytics
  dpi: 300
  # variabili cliniche usate per il controllo di bilanciamento train/test
  balance_columns:
    - Age
    - Gender
    - BMI
    - waist1
    - Bpsys
    - Bpdia
    - FPG
    - HbA1c
    - CHOL
    - TG
    - HDL
    - LDL
    - SUA
    - ALT
    - HGB
  simulation_runs: 1000

# selezione delle feature: ogni colonna del dataset sta in esattamente un gruppo
# (escluso per un motivo, oppure numerica / categorica in input). Motivi in Notepad.md
features:
  exclude:
    # il target è calcolato da queste colonne (o ne è una copia)
    leakage: [SCRE, UMAUCR, UmALB, UCRE, GFR, highCr, HighUmALB, HighACR, ACR3degree,
              GFR5lev, GFR6levG5, EUGFRabACR012, EUGFR90UACR01, EUGFR60abACR012, UACRGFR, DN]
    # esami o diagnosi renali: violano "senza esami renali"
    renal_exams: [BUN, RF]
    admin: ["NO", Data, filter, GAnum, GAstudy]
    undocumented: [VAR00001, ALT.1, DF]
    # > 50% NA, costanti o compilate solo da un sottogruppo
    sparse: [CDSMS, GLU, HPLC, PLCR, DMnew3class, Cancer, EyeDia, DR, ThalussemiaHPLC,
             DyslipideHis, DMhighrisk, SmokingAge, SmokingRange, DrinkingAge, DrinkYears,
             Drink50g, EscDrink, EscDrinkM, EscDrinkT, EscDrinkR, EscDrinkD, EscDrinkO]
    knowledge_survey: [Known, OPD, ToChilren, DietExcise, Compl, Check, GlucoseLev]
    # soglie o classificazioni di variabili già presenti
    derived: [Age3Group, AgeGroup, BMI4Class, overweight, obesity, WGOCobBMI, BMI25,
              WC9085, WC8580, WC9080, BP13085, WHO1999hbp, Fat2Class, Fat3Class, ALTn, TBILn,
              TGdis, DysHDLIDFNCEP, JCDHDLdis, CDSdyelip, HighUA, Hb4per, Anemia, FIB4n,
              FPGover7, P2PGover11, A1cover6575, PGclass3, PGclass6, Smoking2, Drinking2,
              FatherDM, MotherDM, BSDM, ChildDM, ThalussemiaAND, ThalussemiaOR]
    duplicate_measures: [Waist2]
    linear_combinations: [IDBIL, GLO]
    # 9 = sconosciuto: dopo la ricodifica > 15% NA e nessun segnale
    comorbidities: [Angina, Arrhythmia, PAD, Hyper16, Hyper13, Blind, CerebralHe, CerebralIn,
                    TIA, MI, HF, CAP, Hypo14, Amputation, WeightLoss]
    # Homaβ = 20·FINS/(FPG − 3,5): la formula esplode con glicemia vicina a 3,5 (valori > 1000)
    unstable_indices: [Homaβ]
    # > 15% NA sul training
    high_missing: [leg, LC, LCcount, ALY, ALYcount]
  max_missing: 0.15
  numeric: [Age, Height, Weight, BMI, waist1, hip, WHR, HR, Bpsys, Bpdia, Fat, GA, FPG, PG2h,
            HbA1c, FINS, FCP, INS2h, CP2h, HomaIR, ISIGutt, ALT, AST, ASTALT, GGT, ALP,
            TBIL, DBIL, TP, ALB, AG, CHOL, TG, HDL, LDL, SUA, WBC, RBC, RDWCV, RDWSD, MCV, HCT,
            LYMPH, LYMPHcount, MCH, MCHC, MPV, BASO, BASOcount, EO, EOcount, HGB, PLT, PDW, PCT,
            MONO, MONOcount, NEUT, NEUTcount, FIB4]
  categorical: [Gender, DM, DMhis, Smoking, Drinking, Tea, DMfamilyHistory, HypertenHis,
                DRyd, cataract, MADPN, TFDPN, HbsAg, HCVAb]
  # 1 = no, 2 = occasionalmente, 3 = regolarmente -> 0, 1, 2
  ordinal: [Smoking, Drinking, Tea]
  # colonne in cui il dizionario usa 9 = sconosciuto: nessuna deve restare in input
  unknown_code: 9
  unknown_columns: [Angina, Arrhythmia, PAD, Hyper16, Hyper13, Blind, Cancer, CerebralHe,
                    CerebralIn, TIA, MI, HF, CAP, Hypo14, RF, Amputation, WeightLoss, FatherDM,
                    MotherDM, Known, OPD, ToChilren, DietExcise, Compl, Check, GlucoseLev]
  # alterate dalla malattia renale: escluse nel set di sensibilità "no_consequence"
  consequence: [HGB, RBC, HCT, SUA, ALB, TP, GA]

# confronto dei metodi di imputazione (solo training, cross-validation)
imputation:
  output: analytics/preprocessing
  # metodo adottato per tutti i set e per entrambe le fasi (A e B); motivazione nel Notepad,
  # passi 8-10: regola in due fasi al margine, decide il confronto appaiato sui fold
  method: MissForest
  cv_folds: 5
  mask_fraction: 0.1
  knn_neighbors: 5
  mice_max_iter: 10
  # MissForest "con freni": pochi alberi, poche iterazioni, colonne complete solo come predittori
  forest_trees: 50
  forest_min_samples_leaf: 5
  forest_max_iter: 5

# fasi A e B: cross-validation annidata. Fold esterni = imputation.cv_folds (gli stessi del
# confronto delle imputazioni); fold interni per ottimizzare gli iperparametri
cv:
  inner_folds: 5
  # fold imputati salvati una volta sola (non versionati)
  imputed: data/processed/imputed

# fase A: protocollo fissato il 19/09/2026, prima di vedere i risultati (Notepad, sezione
# "Fase A — modelli e protocollo"). Gli stessi modelli si usano in fase B
phase_a:
  output: analytics/phase_a
  # modelli finali: models/phase_a_<modello>_<set>.joblib (non versionati)
  models_dir: models
  models: [dummy, lr_scored, lr_penalized, random_forest, xgboost]
  # Optuna: TPE (seed del progetto) + MedianPruner, metrica PR-AUC (Brima & Atemkeng 2026)
  n_trials: 100
  # set su cui si ottimizzano gli iperparametri; no_consequence li riusa (opzione A)
  tuning_set: main
  # predittori del punteggio SCORED disponibili nello screening (Bang et al. 2007)
  scored_predictors: [Age, Gender, HGB, Bpsys, DM]
  spaces:
    # forza della penalizzazione e mescolanza L1/L2: 0 = L2, 1 = L1 (Zou & Hastie 2005)
    lr_penalized:
      C: {type: float, low: 1.0e-4, high: 10.0, log: true}
      l1_ratio: {type: float, low: 0.0, high: 1.0}
    # Brima & Atemkeng 2026, App. A6; frazioni di max_features scelte da noi
    random_forest:
      n_estimators: {type: int, low: 100, high: 1000}
      max_depth: {type: int, low: 3, high: 25}
      min_samples_split: {type: int, low: 2, high: 50}
      min_samples_leaf: {type: int, low: 1, high: 20}
      max_features: {type: categorical, choices: [sqrt, log2, 0.25, 0.5, 0.75]}
      criterion: {type: categorical, choices: [gini, entropy]}
    # Brima & Atemkeng 2026, App. A6; learning rate in scala logaritmica scelta da noi
    xgboost:
      n_estimators: {type: int, low: 200, high: 1200}
      learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
      max_depth: {type: int, low: 3, high: 12}
      subsample: {type: float, low: 0.6, high: 1.0}
      colsample_bytree: {type: float, low: 0.5, high: 1.0}
      reg_alpha: {type: float, low: 0.0, high: 5.0}
      reg_lambda: {type: float, low: 0.0, high: 5.0}
  # analisi di sensibilità decise DOPO i risultati (dichiarate nel Notepad): stesso protocollo, un
  # solo modello con lo spazio modificato; risultati in analytics/phase_a/sensitivity/<nome>/, i
  # risultati primari restano quelli con gli spazi sopra
  sensitivity:
    # XGBoost ha scelto max_depth = 3 (limite inferiore) in 6 ottimizzazioni su 6: spazio allargato
    # a 1-12, lo stesso che userà la Fase B
    depth_1_12:
      model: xgboost
      space:
        max_depth: {type: int, low: 1, high: 12}

# valutazione della fase A sulle previsioni out-of-fold del training (domande 1-4 dello Scope).
# fissata il 19/09/2026 prima di calcolare qualsiasi metrica (Notepad, "Valutazione: scelte fissate prima dei risultati")
evaluation:
  output: analytics/phase_a/evaluation
  # soglia di classificazione: "sensitivity" (sensibilità fissata sui positivi) oppure "youden"
  threshold_rule: sensitivity
  target_sensitivity: 0.90
  # altri punti operativi, solo descrittivi (Wynants et al. 2019)
  sensitivity_grid: [0.80, 0.85, 0.90, 0.95]
  # fasce di rischio: 4, con le stesse proporzioni dei livelli KDIGO nel training (quantili di p)
  bands: kdigo_quantiles
  kappa_weights: linear
  alpha: 0.05
  # bootstrap stratificato sul livello KDIGO (Boyd et al. 2013): kappa, medie per livello, tendenza
  bootstrap: 2000
